name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs the Swift package and policy tests against the exact SwiftSpice release
# in Package.resolved. App assembly, Mach-O closure auditing, live SPICE behavior,
# and clean-machine portability remain explicit release gates.

jobs:
  swift-tests:
    name: Swift 6.3 checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Test suite
        run: make test

      - name: Version consistency (Info.plist / CHANGELOG / links)
        run: ./scripts/check-version.sh

  shell-lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck scripts
        run: shellcheck --severity=warning -x scripts/*.sh
