name: CI

on:
  push:
    branches: [main]
  pull_request:

# The full app needs Xcode's Metal toolchain and the native SPICE sysroot, neither
# of which CI fetches. These jobs cover the 58 dependency-light Swift checks:
# .vv parsing, keyboard input routing, clipboard gating, cursor policy, and
# session lifecycle/command state.
# The CocoaSpice fork patch and focused stutter/worker XCTest targets are
# release-gated locally with `make test-stutter`, `make test-worker`, and
# `make build`. They need the staged native frameworks plus Xcode's Metal modules,
# so they cannot run in this dependency-free job.

jobs:
  swift-tests:
    name: Swift 6.2 checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Dependency-light test suite
        run: make test

      - name: Version consistency (Info.plist / CHANGELOG / links)
        run: ./scripts/check-version.sh

  shell-lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck scripts
        run: shellcheck --severity=warning -x scripts/*.sh
